# Lint settings, so `ruff check app tests` means the same thing everywhere.
line-length = 120
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "FURB"]
# The adapters catch every exception on purpose: a failed Zetaris or Nightshift
# call degrades to the deterministic path and is logged as a fallback.
ignore = ["BLE001"]
